    <script>/* MARWADI INTRO: decide BEFORE first paint whether the intro plays (no flash). Plays once per visit, never on #anchor links or reduced-motion. */
        (function () { try { var f = /[?&]intro=1/.test(location.search) || window.MI_FORCE; if (f || (!sessionStorage.getItem("mi_seen") && !location.hash && !matchMedia("(prefers-reduced-motion:reduce)").matches)) document.documentElement.classList.add("mi-on") } catch (e) { } })();</script>
    <style id="mi-css">
        /* ===== MARWADI INTRO (splash) ===== */
        #mi {
            display: none
        }

        html.mi-on #mi {
            display: block
        }

        html.mi-on {
            overflow: hidden
        }

        #mi {
            position: fixed;
            inset: 0;
            z-index: 9999;
            overflow: hidden;
            color: #fff;
            background: radial-gradient(60% 55% at 50% 48%, #0B3D8A 0%, #052A63 38%, #02183D 70%, #010E26 100%);
            font-family: inherit
        }

        .mi-grid {
            position: absolute;
            inset: -48px;
            background-image: linear-gradient(rgba(250, 211, 39, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(250, 211, 39, .07) 1px, transparent 1px);
            background-size: 48px 48px;
            -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 15%, transparent 68%);
            mask-image: radial-gradient(circle at 50% 50%, #000 15%, transparent 68%);
            animation: mi-drift 4.5s linear both
        }

        .mi-stars {
            position: absolute;
            inset: 0;
            background: radial-gradient(1.5px 1.5px at 12% 22%, #fff, transparent), radial-gradient(1.5px 1.5px at 82% 16%, #FAD327, transparent), radial-gradient(1.5px 1.5px at 70% 78%, #fff, transparent), radial-gradient(1.5px 1.5px at 24% 84%, #FAD327, transparent), radial-gradient(1px 1px at 46% 10%, #fff, transparent), radial-gradient(1px 1px at 92% 52%, #fff, transparent), radial-gradient(1px 1px at 6% 60%, #fff, transparent);
            animation: mi-tw 2.2s ease-in-out infinite alternate
        }

        .mi-skip {
            position: absolute;
            top: max(16px, env(safe-area-inset-top));
            right: 16px;
            z-index: 5;
            padding: 8px 16px;
            border: 1px solid rgba(250, 211, 39, .5);
            border-radius: 999px;
            background: rgba(2, 24, 61, .6);
            color: #FAD327;
            font: 700 .85rem/1 inherit;
            cursor: pointer;
            animation: mi-up .5s 1.2s both
        }

        .mi-stage {
            --S: min(92vw, 64vh, 600px);
            position: absolute;
            left: 50%;
            top: 47%;
            width: var(--S);
            height: var(--S);
            margin: calc(var(--S)/-2) 0 0 calc(var(--S)/-2)
        }

        .mi-rings {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible
        }

        .mi-rings circle {
            fill: none;
            stroke: #FAD327;
            stroke-width: .25;
            stroke-dasharray: 1 1.4;
            stroke-linecap: round;
            opacity: .55
        }

        .mi-rings .r1 {
            stroke-dashoffset: 200;
            animation: mi-draw 1.4s .2s ease-out forwards;
            stroke-dasharray: 200
        }

        .mi-rings .r2 {
            stroke-dashoffset: 300;
            animation: mi-draw 1.6s .45s ease-out forwards;
            stroke-dasharray: 300;
            opacity: .3
        }

        .mi-fly {
            position: absolute;
            inset: 0;
            animation: mi-expand 1.5s .75s cubic-bezier(.2, .9, .2, 1) both
        }

        .mi-orbit {
            position: absolute;
            inset: 0;
            animation: mi-spin 7s linear infinite
        }

        .mi-orbit.o2 {
            animation: mi-unspin 10s linear infinite
        }

        .mi-c {
            --w: calc(var(--S)*.15);
            --h: var(--w);
            --k: .25;
            position: absolute;
            left: 50%;
            top: 50%;
            width: var(--w);
            height: var(--h);
            margin: calc(var(--h)/-2) 0 0 calc(var(--w)/-2);
            transform: rotate(var(--a)) translateX(calc(var(--S)*var(--k))) rotate(calc(var(--a)*-1))
        }

        .mi-c b {
            position: absolute;
            inset: 0;
            animation: mi-pop .75s calc(.95s + var(--i)*.13s) cubic-bezier(.2, 1.5, .4, 1) both
        }

        .mi-c span {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            animation: mi-unspin 7s linear infinite
        }

        .mi-c.ch {
            --w: calc(var(--S)*.2);
            --h: calc(var(--S)*.07);
            --k: .42
        }

        .mi-c.ch span {
            animation: mi-spin 10s linear infinite;
            border-radius: 999px;
            border: 1px solid rgba(250, 211, 39, .55);
            background: rgba(255, 255, 255, .08);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            color: #fff;
            font-weight: 800;
            font-size: clamp(.62rem, calc(var(--S)*.032), .95rem);
            letter-spacing: .02em
        }

        .mi-c.lg span {
            border-radius: 24%;
            background: #fff;
            box-shadow: 0 0 0 2px rgba(250, 211, 39, .7), 0 10px 26px -6px rgba(0, 0, 0, .6), 0 0 22px -4px rgba(250, 211, 39, .6)
        }

        .mi-c.lg img {
            width: 72%;
            height: 72%;
            object-fit: contain;
            display: block
        }

        .mi-core {
            position: absolute;
            left: 50%;
            top: 50%;
            width: calc(var(--S)*.3);
            height: calc(var(--S)*.3);
            margin: calc(var(--S)*-.15) 0 0 calc(var(--S)*-.15);
            animation: mi-core 1s .1s cubic-bezier(.2, 1.3, .35, 1) both
        }

        .mi-core:before {
            content: "";
            position: absolute;
            inset: -60%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(250, 211, 39, .55), rgba(232, 161, 7, .18) 40%, transparent 68%);
            animation: mi-pulse 1.6s ease-in-out infinite alternate
        }

        .mi-core i {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            border-radius: 22%;
            background: #FCF7EC;
            box-shadow: 0 0 0 3px #FAD327, 0 0 40px 4px rgba(250, 211, 39, .65), 0 18px 40px -10px rgba(0, 0, 0, .7);
            overflow: hidden
        }

        .mi-core i:after {
            content: "";
            position: absolute;
            top: -20%;
            bottom: -20%;
            width: 30%;
            left: -40%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .9), transparent);
            transform: skewX(-18deg);
            animation: mi-sheen 1.1s 1.1s ease-in-out both
        }

        .mi-core img {
            width: 86%;
            height: 86%;
            object-fit: contain;
            position: relative;
            display: block
        }

        .mi-tag {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(11vh + env(safe-area-inset-bottom));
            text-align: center;
            padding: 0 20px;
            font-weight: 800;
            font-size: clamp(1.05rem, 3.4vw, 1.6rem);
            letter-spacing: .01em;
            animation: mi-up .8s 2.2s both
        }

        .mi-tag em {
            font-style: normal;
            color: #FAD327
        }

        .mi-bar {
            position: absolute;
            left: 50%;
            bottom: calc(6vh + env(safe-area-inset-bottom));
            width: min(240px, 56vw);
            height: 4px;
            margin-left: calc(min(240px, 56vw)/-2);
            border-radius: 4px;
            background: rgba(255, 255, 255, .14);
            overflow: hidden
        }

        .mi-bar i {
            display: block;
            height: 100%;
            width: 100%;
            transform-origin: left;
            background: linear-gradient(90deg, #FAD327, #E8A107);
            animation: mi-fill 3.7s .2s cubic-bezier(.4, .1, .3, 1) both
        }

        #mi.out .mi-fly {
            animation: mi-collapse .5s cubic-bezier(.6, 0, .9, .4) both
        }

        #mi.out .mi-core {
            animation: mi-flash .6s ease-in both
        }

        #mi.out .mi-tag,
        #mi.out .mi-bar,
        #mi.out .mi-skip {
            opacity: 0;
            transition: opacity .25s
        }

        #mi.out {
            animation: mi-away .75s .4s cubic-bezier(.7, 0, .9, .4) forwards
        }

        @keyframes mi-draw {
            to {
                stroke-dashoffset: 0
            }
        }

        @keyframes mi-expand {
            from {
                transform: scale(.12);
                opacity: 0
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        @keyframes mi-collapse {
            to {
                transform: scale(.05);
                opacity: 0
            }
        }

        @keyframes mi-spin {
            to {
                transform: rotate(360deg)
            }
        }

        @keyframes mi-unspin {
            to {
                transform: rotate(-360deg)
            }
        }

        @keyframes mi-pop {
            0% {
                transform: scale(0);
                opacity: 0
            }

            100% {
                transform: scale(1);
                opacity: 1
            }
        }

        @keyframes mi-core {
            0% {
                transform: scale(.2) rotate(-12deg);
                opacity: 0;
                filter: blur(10px)
            }

            100% {
                transform: none;
                opacity: 1;
                filter: blur(0)
            }
        }

        @keyframes mi-pulse {
            to {
                transform: scale(1.12);
                opacity: .85
            }
        }

        @keyframes mi-sheen {
            to {
                left: 130%
            }
        }

        @keyframes mi-flash {
            0% {
                transform: scale(1)
            }

            45% {
                transform: scale(1.22);
                filter: brightness(1.35)
            }

            100% {
                transform: scale(2.6);
                opacity: 0
            }
        }

        @keyframes mi-away {
            to {
                opacity: 0;
                transform: scale(1.35);
                visibility: hidden
            }
        }

        @keyframes mi-up {
            from {
                opacity: 0;
                transform: translateY(14px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes mi-fill {
            from {
                transform: scaleX(0)
            }

            to {
                transform: scaleX(1)
            }
        }

        @keyframes mi-drift {
            to {
                transform: translateY(48px)
            }
        }

        @keyframes mi-tw {
            from {
                opacity: .45
            }

            to {
                opacity: 1
            }
        }
    </style>

        }
    </style>

            </svg>
            <div class="mi-fly">
                <!-- inner ring: platforms (logos from images/). To add one: copy a line, change --a (angle), --i (order) and the image -->
                <div class="mi-orbit">

                                    height="64"></span></b></div>
                    <div class="mi-c lg" style="--a:60deg;--i:1"><b><span><img src="images/flipkart.png" alt=""

            </div>
            <div class="mi-core"><i><img src="images/logo-emblem.png" alt="Marwadi Ecom Wala" width="300"
                        height="227"></i></div>
        </div>
        <p class="mi-tag">Building <em>Businesses</em> That Grow.</p>
        <div class="mi-bar"><i></i></div>
    </div>
    <!-- ===== /MARWADI INTRO ===== -->
    <script>/* MARWADI INTRO controller. Total ~4.2s; Skip button; failsafe timer. Change duration: the 3900 below + CSS mi-fill (3.7s). */
        (function () {
            var el = document.getElementById("mi"), root = document.documentElement; if (!el) return;
            if (!root.classList.contains("mi-on")) { el.remove(); return }
            var done = false, t; function end() {
                if (done) return; done = true; clearTimeout(t); el.classList.add("out"); try { sessionStorage.setItem("mi_seen", "1") } catch (e) { }
                t = setTimeout(function () {
    window.location.href = "main.html";
}, 1200);
            }
            t = setTimeout(end, 3900); el.querySelector(".mi-skip").addEventListener("click", end); addEventListener("keydown", function (e) { if (e.key === "Escape") end() })
        })();
    </script>
